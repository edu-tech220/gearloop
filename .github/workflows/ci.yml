name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore GearLoop.sln

      - name: Build
        run: dotnet build GearLoop.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test GearLoop.sln --no-build --configuration Release --verbosity normal

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Api image
        run: docker build -f src/GearLoop.Api/Dockerfile -t gearloop-api:ci .

      - name: Build Web image
        run: docker build -f src/GearLoop.Web/Dockerfile -t gearloop-web:ci .
